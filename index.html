: "实体金属度"}, {"id": "pbr_actor_emis", "title": "实体自发光"}, {"id": "pbr_actor_rough", "title": "实体粗糙"}, {"id": "pbr_actor_sss", "title": "实体次表面"}, {"id": "pbr_part_metal", "title": "粒子金属度"}, {"id": "pbr_part_emis", "title": "粒子自发光"}, {"id": "pbr_part_rough", "title": "粒子粗糙"}, {"id": "pbr_part_sss", "title": "粒子次表面"}, {"id": "pbr_item_metal", "title": "物品金属度"}, {"id": "pbr_item_emis", "title": "物品自发光"}, {"id": "pbr_item_rough", "title": "物品粗糙"}, {"id": "pbr_item_sss", "title": "物品次表面"}]}, {"id": "route", "title": "路由", "kids": [{"id": "look_route", "title": "路由五套完整搭配"}, {"id": "look_route_1", "title": "第一套·路由"}, {"id": "look_route_2", "title": "第二套·路由"}, {"id": "look_route_3", "title": "第三套·路由"}, {"id": "look_route_4", "title": "第四套·路由"}, {"id": "look_route_5", "title": "第五套·路由"}, {"id": "route_water_mode", "title": "全局水模式"}]}, {"id": "combos", "title": "怎么拼", "kids": [{"id": "combo_water_clear", "title": "拼·清水"}, {"id": "combo_water_green", "title": "拼·绿藻湖"}, {"id": "combo_water_tea", "title": "拼·茶水"}, {"id": "combo_water_mud", "title": "拼·浊河"}, {"id": "combo_water_mirror", "title": "拼·平镜"}, {"id": "combo_water_wave", "title": "拼·大浪"}, {"id": "combo_water_cau", "title": "拼·水底光斑"}, {"id": "combo_under_clear", "title": "拼·水下能见"}, {"id": "combo_under_dark", "title": "拼·水下浑浊"}, {"id": "combo_shaft_narrow", "title": "拼·窄柱"}, {"id": "combo_fog_soft", "title": "拼·软雾"}, {"id": "combo_fog_clear", "title": "拼·空气很透"}, {"id": "combo_sun_day", "title": "拼·白日有柱"}, {"id": "combo_sun_warm", "title": "拼·暖黄昏"}, {"id": "combo_moon", "title": "拼·冷月光"}, {"id": "combo_grade_gray", "title": "拼·灰片"}, {"id": "combo_grade_warm", "title": "拼·暖调"}, {"id": "combo_grade_cool", "title": "拼·青冷"}, {"id": "combo_grade_sun", "title": "拼·保住日轮"}, {"id": "combo_look_color", "title": "拼·色相整张"}, {"id": "combo_look_cine", "title": "拼·电影整张"}, {"id": "combo_look_qing", "title": "拼·青整张"}]}, {"id": "gy_split", "title": "方案分开", "kids": [{"id": "gy_split", "title": "方案分开"}]}, {"id": "gy_merge", "title": "方案合并", "kids": [{"id": "gy_merge", "title": "方案合并"}]}, {"id": "gap", "title": "当前缺什么", "kids": [{"id": "gap", "title": "当前缺什么"}]}, {"id": "notes", "title": "示范配方", "kids": [{"id": "nb_color", "title": "示范·色相"}, {"id": "nb_cine", "title": "示范·电影"}, {"id": "nb_qing", "title": "示范·青"}, {"id": "nb_mine", "title": "自己存的配方"}]}], "articles": {"intro": {"id": "intro", "title": "看前介绍", "section": "开始", "sectionId": "home", "crumbs": ["月小雨文档", "开始", "看前介绍"], "lead": "先看这一篇。从手机桌面走进游戏，把引擎和灵动视效开对，再去拧月小雨。开不了灵动也别急着退款，玩法还能用。", "demo": "", "demoLabel": "", "blocks": [{"h": "忠告", "ps": ["本模组使用公开的网易接口和微软接口制作，不存在修改任何非法东西，遵循网易我的世界协议和行为规范。", "目的是让你最大程度用这个模组，做出属于自己的光影。很多功能调完要退出再进地图才会生效，这叫冷重载，不是坏了。", "下面不接任何外网地址。按钮名按你手机上看到的中文来。"]}, {"h": "这个模组有什么", "ps": ["月小雨有两块。一块是玩法：帧数、详细信息、传送、附魔、刷新耐久、幽灵、移动光源、副手、声音显示、高亮信息、准星。这些不靠灵动视效，开不了光影也能用。", "一块是光影：一百八十二条滑条，把雾、天、太阳、水、调色、影子写到旧版还能执行的路径上。要看见柱子和灵动味道，必须先开渲染龙，再开灵动视效，再开体积雾。", "一键套的三套完整光影参数在光影页点「配方」：色相、电影、青。功能和预设一样，都是一键写满数字，但入口不在预设。预设页是月小雨一号整包层，加上复古电视和啤酒瓶滤镜。复古和啤酒不是整包光影。", "群系可以指定：雾和水可以只改你脚下那一块地，也可以改全局。传送能按群系中文名把人送过去。"]}, {"h": "先认两个引擎", "ps": ["网易这一版默认是 OpenGL。OpenGL 是默认引擎，好开、覆盖机器多，但走的是花式那条路，灵动视效的金属、粗糙、自发光、次表面不会完整参与。", "另一个叫 RenderDragon，中文名是渲染龙。它是实验性功能。灵动视效只走渲染龙这条路。不切开渲染龙，就不要指望调光影。", "机器或配置不支持渲染龙、切过去会闪退、进不去灵动视效：别急着退款。玩法十一块都还能用。只是光影那一块先别想。"]}, {"h": "冷重载是什么", "ps": ["热：点写入，这一局画面立刻换。雾柱大多是热的。", "冷：点写入只改磁盘。你还站在原地，画面还是旧的。光照、水面、调色、阴影都是冷的。", "冷重载：先写入，再保存并退出，再进同一个存档。引擎这时才把冷的文件重新读进来。还旧就把游戏彻底关掉再开。", "冷重载不是再点一次写入。写入只负责把数字落到磁盘。"]}, {"h": "第一步：打开游戏，进大厅", "ps": ["从手机桌面点开我的世界。进游戏以后，你先看到的是大厅，不是地图。", "大厅中间是人物。底下最右边有「更多」。先不要点开始游戏。", {"img": "看前介绍/01.png", "cap": "这是大厅。底下从左到右有背包、图书馆、好友、新鲜事、更多。先点「更多」。"}]}, {"h": "第二步：更多 → 设置", "ps": ["点「更多」以后，右边会弹出一列。里面有邮件、扫一扫、反馈、设置。点「设置」。", {"img": "看前介绍/02.png", "cap": "右边这一列就是「更多」。齿轮那一行是「设置」。点它。"}]}, {"h": "第三步：点「画面」，往下滑", "ps": ["设置左边有声音、画面、操作、隐私、功能、其他、截图。点「画面」。", "上面是局内视角、画质等级这些。先往下滑，滑到最底下。", {"img": "看前介绍/03.png", "cap": "左边点「画面」。这是画面页的上半截，先记住往下滑。"}, {"img": "看前介绍/04.png", "cap": "继续往下。最底下有「渲染引擎」，现在多半写着 OpenGL（默认）。"}, {"img": "看前介绍/05.png", "cap": "红圈圈住的就是「渲染引擎」。点这一行，不要点旁边的亮度或视野。"}]}, {"h": "第四步：换成渲染龙", "ps": ["会弹出「切换渲染引擎」。左边 OpenGL 写着默认、当前。右边是 RenderDragon，下面写实验性功能。中文名就是渲染龙。", "点右边的 RenderDragon（渲染龙）。确认切换这时可能还是灰的，先别慌。", {"img": "看前介绍/06.png", "cap": "弹出「切换渲染引擎」。左边是默认 OpenGL，右边是渲染龙。"}, {"img": "看前介绍/07.png", "cap": "红圈要圈的是右边 RenderDragon（渲染龙）。点它。"}, "点了以后，要在框里输入三个字：我确认。一个字都不能错。然后点「确认切换」。", "游戏会关掉。这是正常的，不是坏了。", {"img": "看前介绍/08.png", "cap": "框里写「我确认」，再点绿色的「确认切换」。游戏会闪退。"}]}, {"h": "第五步：重新进游戏，进一张地图", "ps": ["从桌面再打开我的世界。等加载走完。随便进一张地图测试就行。", {"img": "看前介绍/09.png", "cap": "重新进游戏时会看到加载。等「正在生成世界」走完。"}]}, {"h": "第六步：设置 → 视频 → 图形模式选灵动视效", "ps": ["进地图后，点暂停里的设置，再点「视频」。左边「视频」要是亮的。", "先往下滑。你会看到「渲染引擎」已经写成 RenderDragon。", "再找「图形模式」。点「灵动视效」。再点「自定义」。底下有「灵动视效选项」，点进去。", {"img": "看前介绍/10.png", "cap": "这是视频设置的上半截。先往下滑，不要停在亮度这里。"}, {"img": "看前介绍/14.png", "cap": "切成功以后，「渲染引擎」会写成 RenderDragon。没写成，回到第四步再切一次。"}, {"img": "看前介绍/11.png", "cap": "图形模式里点「灵动视效」，再点「自定义」。底下「灵动视效选项」再点一下。"}]}, {"h": "第七步：最少开体积雾，上采样选双线性，分辨率选原始", "ps": ["别的档你先别管。最少把「体积雾质量」开到高或极致。体积雾关着，就没有柱子，也没有丁达尔那种从树缝里漏下来的光。", "「上采样模式」选「双线性」。", "「分辨率」选「原始」。选低了，画面会糊，那不是模组坏了。", {"img": "看前介绍/12.png", "cap": "自定义打开以后，把体积雾质量拉到高。这是柱子的总闸。"}, {"img": "看前介绍/13.png", "cap": "上采样模式选双线性。分辨率拉到最右边「原始」。"}]}, {"h": "开成了和开不成", "ps": ["以上都能点进去、体积雾也开了：你才能完整用这个模组的光影。回到游戏里，点右上角「月小雨」，再按左边目录一条一条看。", "渲染龙切不过去、灵动视效是灰的、体积雾没有：别急着退款。玩法里的帧数、详细信息、传送、附魔、刷新耐久、幽灵、移动光源、副手、声音显示、高亮信息、准星都还能用。调光影效果先别想。", "看完这篇，再点下一篇「月小雨灵动视效」。那里讲热、冷、和这一百八十二条怎么读。"]}]}, "home": {"id": "home", "title": "月小雨灵动视效", "section": "开始", "sectionId": "home", "crumbs": ["月小雨文档", "开始"], "lead": "在这份文档里，我们一起把模组已经接上的能力讲清楚。先分清热和冷，再按左边目录点进去。每一条都有示范数字。", "demo": "", "demoLabel": "", "blocks": [{"h": "你先要知道的三件事", "ps": ["热：点写入，这一局画面立刻换。雾柱组大多是热的。", "冷：点写入只改磁盘。这一局还是旧画面。光照、水面、调色、阴影都是冷的。", "冷重载：先写入，再保存并退出，再进同一个存档。不是再点一次写入。还旧就把游戏彻底关掉再开。", "体积雾要在视频设置里打开。关着就没有柱子。开不了灵动：玩法十一块仍可用。"]}, {"h": "这份文档怎么看", "ps": ["左边是目录。先点板块，再点一条。右边一次只显示一篇，和开发者官网一样。", "上面搜索框可以按中文名找，比如「太阳本源」或「群系雾柱浓度」。", "一篇看完，用右下角「下一篇」按顺序读。不要一次拧完全组滑条。", "滑条在游戏里点右上角月小雨。这里是说明书，不是第二套拉条。", "还没开渲染龙和体积雾，先回上一篇「看前介绍」。"]}, {"h": "这里有什么", "ps": ["已映射滑条 182 条，一条一篇。上面甲乙丙是举例，下面详细用面板上的真实名字和真实数字。", "另有从零冷热、母面板、颜色供给、各面板、玩法、怎么拼、方案分开与合并、当前缺什么、示范配方。", "示范都是模组面板上的中文参数和数字，例如太阳本源R 默认 255、试低 180。"]}]}, "cold": {"id": "cold", "title": "从零冷热", "section": "从零冷热", "sectionId": "cold", "crumbs": ["月小雨文档", "从零冷热", "从零冷热"], "lead": "这一节只讲热、冷、冷重载。先把这三句话背下来，再去拧滑条。", "demo": "", "demoLabel": "", "blocks": [{"h": "正文", "ps": ["这一节只讲热、冷、冷重载。先把这三句话背下来，再去拧滑条。", "热：你点写入，这一局画面立刻换。雾柱组大多是热的。", "冷：你点写入，只改磁盘上的文件。这一局还是旧画面。光照、水面、调色、阴影、路由、大气都是冷的。", "冷重载：先写入，等提示已经写盘。打开暂停菜单，点保存并退出。再从存档列表进同一个世界。引擎这时才把冷的文件重新读进来。", "冷重载不是再点一次写入。写入只负责把数字落到磁盘。读文件发生在进世界的时候。你冷改完还站在原地等，画面不会变。", "如果退世界再进还是旧的：把游戏彻底关掉，不要只退到标题。结束后台，再开游戏，再进这个存档。", "体积雾必须在视频设置里打开。关着体积雾，雾柱数字写得再完整也没有柱子。太阳太暗也没有柱子。", "开不了灵动视效：别急着退款。玩法十一块都还能用。只是不要指望调光影。", "滑条在游戏里点右上角月小雨。本页是说明书。"]}]}, "parent": {"id": "parent", "title": "母面板", "section": "母面板", "sectionId": "parent", "crumbs": ["月小雨文档", "母面板", "母面板"], "lead": "这一节讲大门和房间。先分清你点的是哪一扇门。", "demo": "", "demoLabel": "", "blocks": [{"h": "正文", "ps": ["这一节讲大门和房间。先分清你点的是哪一扇门。", "右上角「月小雨」是自定义面板。一百八十二条滑条在这里。", "暂停菜单里的模组设置是另一扇门，字在左栏，做不成网站那种排版。完整说明书在这份文档站。", "顶栏从左到右：玩法、光影、预设、三方、接管、微调、水下、调色、氛围、天体、灵动。", "玩法不管雾和水。光影才是一百八十二条的家。色相、电影、青三套完整光影参数在光影页点「配方」，不在预设。功能和一键套预设一样，都是写满一百八十二条，但入口不在预设。", "预设是月小雨一号整包层，加上复古电视剧和啤酒瓶滤镜。三方看别人的包。接管决定谁说了算。", "微调、水下是雾和水的快捷档，和光影里同一批数字。顶栏「调色」是色格，不是光影里那组中间调滑条。", "氛围管日夜走多快。天体换日轮月轮和天的图。灵动去拨游戏自己的体积雾、双线性、原始分辨率。", "光影左边再切：雾柱、大气、光照、水面、调色、阴影、路由。它们和光照同一级，不是另做一套渲染。", "没有立方体贴图子面板。次表面在阴影回退里。黄昏不是自动另做一套光。", "看完去各面板，每一页把按钮逐个讲完。"]}]}, "colors": {"id": "colors", "title": "颜色供给", "section": "颜色供给", "sectionId": "colors", "crumbs": ["月小雨文档", "颜色供给", "颜色供给"], "lead": "这一节只讲颜色供给：一共有多少、分几摊、哪些会重复。", "demo": "", "demoLabel": "", "blocks": [{"h": "正文", "ps": ["这一节只讲颜色供给：一共有多少、分几摊、哪些会重复。", "先记住：颜色绝对多。同一块红，可能在色格里有、在五百档色相里有、在太阳红滑条里也有。不是坏了，是好几摊入口都能碰到相近的色。", "第一摊：顶栏调色页十八个色格。点一下推当前目标的雾色。这十八个和色相前十八档是同一批。", "第二摊：色相大约五百档。前十八档锁定为那十八个色格。后面是命名色、色环、浅档深档。名字里会有「补一百二十」这种补档，看起来像重复，其实是把色环铺满。", "第三摊：远景雾色一长串。旧的六档还在：天蓝、冷蓝、灰白、暖橙、粉、紫。后面只追加，不改旧编号。", "第四摊：天空颜色二十多档。第一档叫「不改」。后面有冷蓝、青绿、暖橙、品红，也有电影蓝、霓虹粉。这些名字和色相里的电影蓝、霓虹粉会撞名，但改的不是同一处。", "第五摊：光影滑条里的红绿蓝。太阳本源、月光、底光、散射、远雾色、水下远雾色、火把灯笼蜡烛，各自三条。数字都是零到二百五十五。", "第六摊：天体页还有日轮月轮的红绿蓝加减，外加一排色格给日和月。恢复默认色、使用太阳、使用月亮，和光影里的太阳本源不是同一个旋钮。", "第七摊：调色滑条的中间调、高光、阴影。现在多数是三通道一起走。阴影增益红、绿、蓝是分开的。", "第八摊：帧数显示自己的红绿蓝，只改屏幕上那个数字的颜色，不改世界。", "希望你理解：粉、暖橙、电影蓝这种名字会出现好几次。点之前先看你在哪一页。色格页的粉是雾。天空档的粉是天。太阳本源红是地上的阳光。帧数红是字的颜色。", "颜色绝对多。不要因为看见两个「粉」就以为坏了。", "本页不接任何外网地址。滑条在游戏里点右上角月小雨。"]}]}, "panel_play": {"id": "panel_play", "title": "玩法", "section": "各面板", "sectionId": "panels", "crumbs": ["月小雨文档", "各面板", "玩法"], "lead": "【玩法】", "demo": "", "demoLabel": "", "blocks": [{"h": "正文", "ps": ["【玩法】", "属于：顶栏最左边。回馈功能的家，不写灵动数字。", "屏幕上有：帧数显示、详细信息、传送、附魔、刷新耐久、幽灵、移动光源、副手、声音显示、高亮信息、准星、教程。下面有返回。", "点「帧数显示」：进独立页，调字的颜色和大小。开了详细信息时这里休眠。", "点「详细信息」：进独立页，勾坐标朝向群系。开它则帧数休眠。不改光影。", "点「传送」：进搜索群系页。跨维会先问一句。", "点「附魔」：拿着东西选原版书，点附上，不耗经验。", "点「刷新耐久」：一键把手上、栏里、身上能修的都拉满。没有分页。", "点「幽灵」：进灵魂或身体页。关掉会交还飞行。", "点「移动光源」：一键开或关。拿着火把灯，脚边临时亮。", "点「副手」：一键开或关。默认开。背包点物品再点左边副手格。", "点「声音显示」：进频率和拖动页。谁在走、跳、挖会出中文。", "点「高亮信息」：进大小和拖动页。准星指什么就显示中文名。", "点「准星」：只藏中间那个点，不关整个界面。", "点「教程」：进本说明书。", "热：玩法都是这一局立刻变。不改雾、水、太阳。", "看完点返回回顶栏。"]}]}, "panel_shader": {"id": "panel_shader", "title": "光影", "section": "各面板", "sectionId": "panels", "crumbs": ["月小雨文档", "各面板", "光影"], "lead": "【光影】", "demo": "", "demoLabel": "", "blocks": [{"h": "正文", "ps": ["【光影】", "属于：一百八十二条已映射滑条的家。", "屏幕上左边切组：雾柱、大气、光照、水面、调色、阴影、路由。", "每一条都有减号、拉条、加号、右边当前数字。加减和拉条都能改。按住拉条马上改值、马上改数字。", "点「写入」：只把当前这条落到磁盘。热的当时能看见，冷的要保存并退出再进。", "点「全写」：把当前能写的都落盘。仍要按冷热决定要不要退世界。", "点「归零」：交还命令雾和天空叠层，卸掉包内覆盖，冷重载后回到原版灵动。", "点「上」「下」：翻这一组的滑条。长页必须翻，字不能漏出黑底。", "点「填」：按当前选中条的规则填一档。", "点「十倍」：步进变大，适合太阳能量这种大数。", "点「详细」：看当前条的说明。完整说明书也在教程里。", "点「配方」：打开配方库。色相、电影、青三套完整光影参数在这里，不在顶栏预设。功能和一键套预设一样，点一下就写满一百八十二条。", "配方库里还可以保存本组、保存整份、上页下页。自己存的套也在这里点名字套上。", "中间有数字框，但教程页不能再挂第四个输入框。光影页这个框只给当前条。", "顶上状态字会告诉你：草稿未写、已写待冷重载、热已生效。", "群系条：全局或指定。指定只改你搜到的那个群系。搜索、上一个、下一个、这里、清除、点名，都在顶上。", "不是新的渲染阶段，也不是假后处理。", "看完回各面板。"]}]}, "panel_preset": {"id": "panel_preset", "title": "预设", "section": 、现在几点、几个画面开关开没开。不改光影，也不改雾和水。开了以后独立帧数会休眠，避免两行抢位置。"]}, {"h": "正文", "ps": ["【详细信息】", "属于：玩法。一篇只讲这一块。", "干什么：详细信息是屏幕上的中文小黑板：告诉你人在哪、朝哪、准星指什么、现在几点、几个画面开关开没开。不改光影，也不改雾和水。开了以后独立帧数会休眠，避免两行抢位置。", "干什么：给你看「现在怎样」，不是给你拧光影。勾上的条目才会出现在屏幕上。", "左边默认开：帧数、坐标、朝向、准星、群系、维度。", "右边默认开：游戏时、亮度、美丽天空、平滑光。", "其余默认关：方块、区块、速度、视野、界面透明度、渲染云、花俏叶、视角摇、附近实体。", "帧数：一秒钟画面翻几下。", "坐标：头在世界里的位置，东西、上下、南北。", "方块：脚踩着的那一格。", "区块：十六格一块的大地编号。", "朝向：脸朝哪，后面两个数是左右转和抬头低头。", "准星：对着空地、方块还是实体。对着方块带那一格位置。", "速度：每秒多少格。", "群系：脚下这块地的中文名。", "维度：主世界、下界、末地。切世界时写成切换中。", "游戏时：这个世界现在几点。六点左右天亮，十八点左右天黑。", "亮度、视野、界面透明度：只读，不在这里拧。", "美丽天空、渲染云、平滑光、花俏叶、视角摇：只告诉你游戏里开没开。要改去灵动页。", "附近实体：大约二十四格里有多少个，只报个数。", "装不上的就不装：天气、方块光照、延迟、显卡，列表里没有。", "屏幕上还有：总开关、要拖动、上、下、每条的显示勾、左列右列。一页四条。", "开它会让独立帧数休眠。不改光影。", "看完点返回，回玩法列表接着看别的。"]}]}, "play_tp": {"id": "play_tp", "title": "传送", "section": "玩法功能", "sectionId": "play", "crumbs": ["月小雨文档", "玩法功能", "传送"], "lead": "传送：上面搜索框指定群系，点索引再传送。跨维会先问一句。", "demo": "", "demoLabel": "", "blocks": [{"h": "这一项干什么", "ps": ["传送：上面搜索框指定群系，点索引再传送。跨维会先问一句。"]}, {"h": "正文", "ps": ["【传送】", "属于：玩法。一篇只讲这一块。", "干什么：传送：上面搜索框指定群系，点索引再传送。跨维会先问一句。", "屏幕上有：搜索框、找出、索引列表、传送、跨维确认、返回。", "上面搜索框写群系中文，点找出，再点一条传送。", "跨维会先问一句。确认才走。", "人被送到那个群系附近。不是改光影，也不是天体换太阳图。", "看完点返回，回玩法列表接着看别的。"]}]}, "play_ench": {"id": "play_ench", "title": "附魔", "section": "玩法功能", "sectionId": "play", "crumbs": ["月小雨文档", "玩法功能", "附魔"], "lead": "拿着要附的物品。选原版附魔书，等级按书上的 I 到最高（如锋利 V）。点附上，不耗经验。", "demo": "", "demoLabel": "", "blocks": [{"h": "这一项干什么", "ps": ["拿着要附的物品。选原版附魔书，等级按书上的 I 到最高（如锋利 V）。点附上，不耗经验。"]}, {"h": "正文", "ps": ["【附魔】", "属于：玩法。一篇只讲这一块。", "干什么：拿着要附的物品。选原版附魔书，等级按书上的 I 到最高（如锋利 V）。点附上，不耗经验。", "屏幕上有：四本原版书、上、下、等级减加和拉条、主手、副手、附上、返回。", "先拿着要附的东西。选书，等级按书上的最高，比如锋利最高五。", "点「附上」：物品带上原版附魔，不耗经验。同一种覆盖等级。", "只改物品附魔，不改雾和水。", "看完点返回，回玩法列表接着看别的。"]}]}, "play_dura": {"id": "play_dura", "title": "刷新耐久", "section": "玩法功能", "sectionId": "play", "crumbs": ["月小雨文档", "玩法功能", "刷新耐久"], "lead": "刷新耐久：把手上、栏里、身上能修的都拉满。点一下就执行。", "demo": "", "demoLabel": "", "blocks": [{"h": "这一项干什么", "ps": ["刷新耐久：把手上、栏里、  ["月小雨文档", "阴影", "阴影样式"], "lead": "在这一节中，我们只讲「阴影样式」。面板上就叫这个名字。", "demo": "光影 → 阴影 → 阴影样式\n冷热：冷：写入后要退出世界再进\n最小 \n最大 \n默认 soft_shadows\n示范甲：写成 软阴影\n示范乙：写成 方块阴影\n示范丙：写成 软阴影\n怎么调：光影→阴影→这一条。减号、拉条、加号都能改。\n减号、拉条、加号都能改。右边数字是当前值。点写入才落盘。", "demoLabel": "复制示范", "blocks": [{"h": "理解这一条", "ps": ["在这一节中，我们只讲「阴影样式」。它不和其他滑条挤在同一页。", "面板上这条就叫「阴影样式」，没有别的名字。它的意思是：影子硬还是软。", "它单独决定什么：只决定影子硬还是软。", "它决定不了什么：软影帮柱子找出缝。它不是体积雾。"]}, {"h": "游戏里会看见什么变", "ps": ["树、人、房子在地上的影子，是软边还是一格一格硬边。软影边缘糊一点，树缝里更容易看出光柱的缝；硬影像积木。", "只改这一条会怎样：只改这一条：影子软还是硬。雾浓不浓不会变。"]}, {"h": "必须一起改才会看得出", "ps": ["它不是体积雾。柱子还是雾和太阳做的。软影只是帮你把缝找出来。格子大小是「阴影texel」。冷重载。", "完整一套数字在这一组最前面的五套搭配里。单条页的甲乙丙只试这一条。"]}, {"h": "冷热和数字", "ps": ["冷：写入后要退出世界再进。", "最小 。最大 。默认 soft_shadows。"]}, {"h": "示范甲、乙、丙（举例）", "ps": ["甲乙丙只是举例，方便记住三个数。不是另一套光影，也不是这条滑条的另一个名字。", "示范甲：先写成默认 软阴影，看原样。", "示范乙：写成 方块阴影。", "示范丙：写成 软阴影。"]}, {"h": "详细：真实名字和真实数字", "ps": ["把「阴影样式」写成 软阴影：这是本条默认。先看原样。现在不要动别的条。", "把「阴影样式」写成 方块阴影：和默认不同。这时硬影子。只决定影子硬还是软。", "把「阴影样式」再写成 软阴影：丙用来和乙那一档对比，不是第三套光影。", "调高会怎样：把「阴影样式」往大写：这时软影子。只决定影子硬还是软。", "调低会怎样：把「阴影样式」往小写：回到默认 软阴影 就接近这条原样。软影帮柱子找出缝。它不是体积雾。", "不要和谁搞混：软影帮柱子找出缝。它不是体积雾。 完整味道去怎么拼，那里写的也是面板上真实存在的滑条名和数字。"]}, {"h": "怎么调、冷热怎么被读到", "ps": ["怎么调：光影→阴影→这一条。减号、拉条、加号都能改。", "右边数字就是当前值。点写入才落到磁盘。", "冷启动：读全局影子和回退。", "滑条在游戏里点右上角月小雨。本页是说明书。"]}]}, "sh_texel": {"id": "sh_texel", "title": "阴影texel", "section": "阴影", "sectionId": "shadow", "crumbs": ["月小雨文档", "阴影", "阴影texel"], "lead": "在这一节中，我们只讲「阴影texel」。面板上就叫这个名字。", "demo": "光影 → 阴影 → 阴影texel\n冷热：冷：写入后要退出世界再进\n最小 1\n最大 64\n默认 16\n示范甲：写成 16\n示范乙：写成 8\n示范丙：写成 32\n怎么调：光影→阴影→这一条。减号、拉条、加号都能改。\n减号、拉条、加号都能改。右边数字是当前值。点写入才落盘。", "demoLabel": "复制示范", "blocks": [{"h": "理解这一条", "ps": ["在这一节中，我们只讲「阴影texel」。它不和其他滑条挤在同一页。", "面板上这条就叫「阴影texel」，没有别的名字。它的意思是：影子格子大小。", "它单独决定什么：只决定影子格子大小。", "它决定不了什么：大了省、糊，小了细、更贵。"]}, {"h": "游戏里会看见什么变", "ps": ["硬影子时，格子有多粗。大了省、糊；小了细、更吃机器。软影时这条没那么显眼。", "只改这一条会怎样：只改这一条：影子格子大小。"]}, {"h": "必须一起改才会看得出", "ps": ["要看格子，先把「阴影样式」换成方块阴影。贴图大小不齐时，格子会对不齐。冷重载。", "完整一套数字在这一组最前面的五套搭配里。单条页的甲乙丙只试这一条。"]}, {"h": "冷热和数字", "ps": ["冷     side.innerHTML = html;
    side.querySelectorAll(".sec>button").forEach(function(btn){
      btn.onclick = function(){ btn.parentNode.classList.toggle("open"); };
    });
  }

  function article(id){
    return byId[id] || byId.intro || byId.home;
  }

  function render(id){
    var a = article(id);
    var idx = order.indexOf(a.id);
    if(idx < 0) idx = 0;
    var prev = idx>0 ? byId[order[idx-1]] : null;
    var next = idx<order.length-1 ? byId[order[idx+1]] : null;
    var crumbs = (a.crumbs||[]).map(function(c,i){
      return i ? '<span>/</span>'+c : c;
    }).join("");
    var blocks = (a.blocks||[]).map(function(b){
      return "<h2>"+b.h+"</h2>"+(b.ps||[]).map(function(p){
        if(p && p.img){
          var cap = p.cap || "";
          return '<figure class="shot"><img src="'+p.img+'" alt="'+cap+'"><figcaption>'+cap+'</figcaption></figure>';
        }
        return "<p>"+p+"</p>";
      }).join("");
    }).join("");
    var demo = "";
    if(a.demo){
      demo = '<div class="box"><button class="copy" type="button">复制示范</button><pre>'+a.demo.replace(/</g,"&lt;")+'</pre></div>';
    }
    var pager = '<div class="pager">';
    pager += prev ? '<a href="#'+prev.id+'"><span class="dir">上一篇</span>'+prev.title+'</a>' : '<span></span>';
    pager += next ? '<a href="#'+next.id+'"><span class="dir">下一篇</span>'+next.title+'</a>' : '<span></span>';
    pager += '</div>';
    view.innerHTML = '<div class="crumbs">'+crumbs+'</div><h1>'+a.title+'</h1><p class="lead">'+(a.lead||"")+'</p>'+demo+blocks+pager;
    var copy = view.querySelector(".copy");
    if(copy){
      copy.onclick = function(){
        if(navigator.clipboard) navigator.clipboard.writeText(a.demo);
        copy.textContent = "已复制";
        setTimeout(function(){ copy.textContent = "复制示范"; }, 1200);
      };
    }
    side.querySelectorAll("a").forEach(function(el){
      el.classList.toggle("on", el.getAttribute("data-id")===a.id);
    });
    var on = side.querySelector("a.on");
    if(on){
      var sec = on.closest(".sec");
      if(sec) sec.classList.add("open");
      on.scrollIntoView({block:"nearest"});
    }
    view.closest("main").scrollTop = 0;
  }

  function go(){
    var id = (location.hash||"#intro").replace(/^#/, "") || "intro";
    render(id);
  }
  q.oninput = function(){ renderSide(q.value); go(); };
  window.addEventListener("hashchange", go);
  renderSide("");
  go();
})();
</script>
</body>
</html>
